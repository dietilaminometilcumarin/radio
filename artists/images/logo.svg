<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150">
  <!-- Белый цвет -->
  <defs>
    <style>
      .main { fill: #ffffff; font-family: Arial, sans-serif; font-weight: 700; }
      .waves { stroke: #ffffff; stroke-width: 4; fill: none; stroke-linecap: round; }
      .hifi { fill: none; stroke: #ffffff; stroke-width: 3; }
      .hifitext { fill: #ffffff; font-family: Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Hi-Fi бейдж -->
  <g transform="translate(20,45)">
    <rect class="hifi" x="0" y="0" width="160" height="70" rx="12" ry="12"></rect>
    <text x="80" y="48" font-size="40" text-anchor="middle" class="hifitext">Hi-Fi</text>
  </g>

  <!-- Основная надпись -->
  <text x="200" y="90" font-size="70" class="main">Digital City</text>



</svg>
